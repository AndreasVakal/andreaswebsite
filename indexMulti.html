<style>
  /* ── Let wrapper span full width so images can scatter ── */
  #wrapper {
    max-width: none !important;
    padding-top: 0 !important;
  }

  /* ── Header stays narrow and centred, just like before ── */
  #header {
    max-width: 400px;
    margin: 0 auto;
    padding-top: 24px;
    text-align: center;
  }

  /* ── Full-viewport canvas for scattered images ── */
  #page {
    position: relative;
    width: 100%;
    min-height: 80vh;
    margin: 0 !important;
    padding: 0 !important;
  }

  #content-index {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 80vh;
    margin: 0 !important;
  }

  /* ── Each image absolutely placed across the canvas ── */
  .scattered-img {
    position: absolute;
    cursor: pointer;
  }

  /* top-left */
  .scattered-img:nth-child(1) {
    width: clamp(70px, 10vw, 150px);
    top: 8%;
    left: 6%;
  }

  /* top-right */
  .scattered-img:nth-child(2) {
    width: clamp(90px, 13vw, 180px);
    top: 5%;
    right: 7%;
  }

  /* centre */
  .scattered-img:nth-child(3) {
    width: clamp(100px, 14vw, 200px);
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
  }

  /* bottom-left */
  .scattered-img:nth-child(4) {
    width: clamp(75px, 10vw, 150px);
    bottom: 12%;
    left: 12%;
  }

  /* bottom-right */
  .scattered-img:nth-child(5) {
    width: clamp(85px, 11vw, 165px);
    bottom: 8%;
    right: 9%;
  }

  /* ── Mobile: drop absolute positioning, stack vertically ── */
  @media (max-width: 700px) {
    #page {
      min-height: unset;
      position: static;
    }

    #content-index {
      position: static !important;
      min-height: unset !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 28px 0 48px;
    }

    .scattered-img,
    .scattered-img:nth-child(1),
    .scattered-img:nth-child(2),
    .scattered-img:nth-child(3),
    .scattered-img:nth-child(4),
    .scattered-img:nth-child(5) {
      position: static !important;
      transform: none !important;
      width: clamp(130px, 60vw, 280px) !important;
    }
  }
</style>
