<style>

  /* ─────────────────────────────────────────
     DESKTOP: images fixed to the viewport
     Each .img-spot is a fixed-position box.
     freezeframe expands to fill that box.
  ───────────────────────────────────────── */

  .img-spot {
    position: fixed;
    overflow: hidden; /* contain freezeframe's wrapper */
    z-index: 0;
    cursor: pointer;
  }

  /* freezeframe generates a wrapper div with class .freezeframe-container
     and an <img> inside. Force both to fill our .img-spot exactly. */
  .img-spot .freezeframe-container,
  .img-spot img {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
  }

  /* 1 – top-left */
  .img-spot.s1 {
    width: 120px;
    height: 120px;
    top: 12vh;
    left: 5vw;
  }

  /* 2 – top-right */
  .img-spot.s2 {
    width: 140px;
    height: 140px;
    top: 8vh;
    right: 6vw;
  }

  /* 3 – centre */
  .img-spot.s3 {
    width: 160px;
    height: 160px;
    top: 50vh;
    left: 50vw;
    transform: translate(-50%, -50%);
  }

  /* 4 – bottom-left */
  .img-spot.s4 {
    width: 110px;
    height: 110px;
    bottom: 14vh;
    left: 10vw;
  }

  /* 5 – bottom-right */
  .img-spot.s5 {
    width: 130px;
    height: 130px;
    bottom: 10vh;
    right: 8vw;
  }

  /* Header text stays on top of the images */
  #wrapper {
    position: relative;
    z-index: 1;
  }

  /* ─────────────────────────────────────────
     MOBILE (≤700px): switch to vertical scroll
  ───────────────────────────────────────── */
  @media (max-width: 700px) {
    .img-spot {
      position: static !important;
      transform: none !important;
      width: 180px !important;
      height: 180px !important;
      margin: 20px auto;
      display: block;
    }
  }

</style>
